name: 每日盘前数据更新与部署

on:
  # 每小时整点自动运行（GitHub Actions schedule 不保证准时，故用单条整点 cron）
  # 覆盖 A股盘中(9-15)、美股盘中(北京 21:30-次日04)、盘前等所有时段
  schedule:
    - cron: "0 * * * *"
  # 手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:
  # 推送代码时也重跑一次数据并部署
  push:
    branches: [ main ]
    paths:
      - 'tools/**'
      - 'site/index.html'
      - 'site/events.json'
      - '.github/workflows/**'

permissions:
  contents: write     # 提交 data.js 回仓库
  pages: write        # 部署 GitHub Pages
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 抓取数据生成 data.js
        run: |
          python tools/update_market_data.py
          echo "---- data.js 摘要 ----"
          head -c 200 site/data.js || true

      # 注意：不把 data.js commit 回 main，避免本地推送冲突
      # data.js 只在 Pages 部署产物里更新，main 分支保持纯净（只存源码）

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 输出访问地址
        run: |
          echo "✅ 已部署，访问地址: ${{ steps.deployment.outputs.page_url }}"
